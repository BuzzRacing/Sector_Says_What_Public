<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish Screen Mockup — Sector Says What</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Titillium+Web:wght@400;600;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ssw-gold: #D4AF37;
    --ssw-gold-glow: rgba(212, 175, 55, 0.6);
    --font-display: 'Titillium Web', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #fff;
    font-family: var(--font-display);
    padding: 40px;
  }

  .mockup {
    max-width: 820px;
    margin: 0 auto 80px;
    padding: 48px 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.85), rgba(0,0,0,0.95));
    border-radius: 16px;
    text-align: center;
    border: 1px solid rgba(212,175,55,0.1);
  }

  /* ── Actions ── */
  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .actions button {
    background: transparent;
    border: 1.5px solid var(--ssw-gold);
    color: var(--ssw-gold);
    padding: 9px 22px;
    border-radius: 4px;
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .actions button:hover {
    background: rgba(212,175,55,0.14);
    box-shadow: 0 0 18px rgba(212,175,55,0.35);
  }
  .actions button.secondary {
    border-color: rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.7);
  }

  /* =================================================================
     PODIUM — Gold / Silver / Bronze, F1 color name block
     ================================================================= */
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    margin-bottom: 36px;
  }
  .pod-card {
    position: relative;
    width: 210px;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* Staggered entrance */
    opacity: 0;
    transform: translateY(40px);
    animation: podSlideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .pod-card.p1 { height: 320px; order: 2; animation-delay: 0.3s; }
  .pod-card.p2 { height: 280px; order: 1; animation-delay: 0.6s; }
  .pod-card.p3 { height: 260px; order: 3; animation-delay: 0.9s; }

  @keyframes podSlideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Medal backgrounds */
  .pod-card.p1 {
    background: linear-gradient(170deg, #D4AF37 0%, #8B7325 50%, #3d3310 100%);
    box-shadow: 0 12px 48px rgba(0,0,0,0.7), 0 0 30px rgba(212,175,55,0.3);
    border: 2px solid rgba(212,175,55,0.4);
  }
  .pod-card.p2 {
    background: linear-gradient(170deg, #C0C0C0 0%, #808080 50%, #333 100%);
    box-shadow: 0 10px 36px rgba(0,0,0,0.7);
  }
  .pod-card.p3 {
    background: linear-gradient(170deg, #CD7F32 0%, #8B5A2B 50%, #3b2410 100%);
    box-shadow: 0 10px 36px rgba(0,0,0,0.7);
  }

  /* Shimmer sweep across the card */
  .pod-card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(105deg,
      transparent 40%,
      rgba(255,255,255,0.12) 45%,
      rgba(255,255,255,0.05) 50%,
      transparent 55%);
    background-size: 300% 100%;
    animation: shimmerSweep 4s ease-in-out infinite;
  }
  .pod-card.p2::before { animation-delay: 0.8s; }
  .pod-card.p3::before { animation-delay: 1.6s; }

  @keyframes shimmerSweep {
    0%, 100% { background-position: 200% 0; }
    50% { background-position: -100% 0; }
  }

  /* Driver photo — flushed right */
  .pod-photo {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: right bottom;
    z-index: 1;
  }
  .pod-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .pod-card.p1 .pod-photo::after {
    background: linear-gradient(90deg,
      rgba(139,115,37,0.95) 0%, rgba(139,115,37,0.4) 35%, transparent 60%);
  }
  .pod-card.p2 .pod-photo::after {
    background: linear-gradient(90deg,
      rgba(128,128,128,0.95) 0%, rgba(128,128,128,0.4) 35%, transparent 60%);
  }
  .pod-card.p3 .pod-photo::after {
    background: linear-gradient(90deg,
      rgba(139,90,43,0.95) 0%, rgba(139,90,43,0.4) 35%, transparent 60%);
  }

  /* Position number */
  .pod-pos {
    position: absolute;
    top: 12px;
    left: 14px;
    z-index: 3;
    font-family: 'Oswald', var(--font-display);
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .pod-card.p1 .pod-pos { font-size: 60px; color: #fff; }

  /* F1 color name block at bottom */
  .pod-name-block {
    position: relative;
    z-index: 2;
    margin-top: auto;
    padding: 12px 14px 14px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--drv-color) 85%, #000) 0%,
      color-mix(in srgb, var(--drv-color) 65%, #000) 100%);
    border-top: 3px solid var(--drv-color);
  }
  .pod-name {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #fff;
    line-height: 1.15;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .pod-card.p1 .pod-name { font-size: 20px; }

  .pod-card.is-owner {
    box-shadow: 0 12px 48px rgba(0,0,0,0.7), 0 0 36px rgba(212,175,55,0.4);
    border: 2px solid rgba(212,175,55,0.5);
  }

  /* =================================================================
     DRIVER OF THE DAY
     ================================================================= */
  .dotd-wrap {
    display: flex;
    align-items: stretch;
    max-width: 540px;
    margin: 0 auto 28px;
    position: relative;
    min-height: 130px;
    /* Entrance animation */
    opacity: 0;
    transform: translateX(-30px);
    animation: dotdSlideIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards;
  }
  @keyframes dotdSlideIn {
    to { opacity: 1; transform: translateX(0); }
  }

  /* Photo — flush left, no box, bleeds against the edge */
  .dotd-photo {
    width: 110px;
    flex-shrink: 0;
    background-size: cover;
    background-position: center top;
    border-radius: 10px 0 0 10px;
    position: relative;
    z-index: 2;
    box-shadow: 4px 0 16px rgba(0,0,0,0.5);
  }

  /* Card body — filled with F1 driver color */
  .dotd-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 28px;
    border-radius: 0 10px 10px 0;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--drv-color) 80%, #000) 0%,
      color-mix(in srgb, var(--drv-color) 45%, #0a0a14) 100%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  /* Gold accent line at top */
  .dotd-body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--ssw-gold), transparent);
  }
  /* Animated glow pulse on the border */
  .dotd-body::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 0 10px 10px 0;
    border: 2px solid var(--ssw-gold);
    opacity: 0;
    animation: dotdGlowPulse 3s ease-in-out 2s infinite;
    pointer-events: none;
  }
  @keyframes dotdGlowPulse {
    0%, 100% { opacity: 0; box-shadow: 0 0 0 rgba(212,175,55,0); }
    50% { opacity: 0.6; box-shadow: 0 0 20px rgba(212,175,55,0.3); }
  }

  .dotd-text {
    flex: 1;
    min-width: 0;
    text-align: left;
  }
  .dotd-tag {
    font-family: 'Oswald', var(--font-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    opacity: 0.85;
  }
  .dotd-name {
    font-family: 'Audiowide', var(--font-display);
    font-size: 28px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
    line-height: 1.1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .dotd-score-area {
    flex-shrink: 0;
    text-align: center;
  }
  .dotd-score {
    font-family: 'Oswald', var(--font-display);
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .dotd-score-label {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  /* ── Action buttons entrance ── */
  .actions {
    opacity: 0;
    animation: fadeIn 0.5s ease 1.6s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="mockup">

  <div class="podium">
    <!-- P2 — Silver bg, Ferrari red name block -->
    <div class="pod-card p2">
      <div class="pod-pos">2</div>
      <div class="pod-photo" style="background-image:url('/drivers/default_male_03.png')"></div>
      <div class="pod-name-block" style="--drv-color:#DC0000">
        <div class="pod-name">Max Verstappen</div>
      </div>
    </div>
    <!-- P1 — Gold bg, McLaren orange name block -->
    <div class="pod-card p1">
      <div class="pod-pos">1</div>
      <div class="pod-photo" style="background-image:url('/drivers/tony_yo.png')"></div>
      <div class="pod-name-block" style="--drv-color:#FF8000">
        <div class="pod-name">Lando Norris</div>
      </div>
    </div>
    <!-- P3 — Bronze bg, McLaren orange name block -->
    <div class="pod-card p3">
      <div class="pod-pos">3</div>
      <div class="pod-photo" style="background-image:url('/drivers/default_female.png')"></div>
      <div class="pod-name-block" style="--drv-color:#FF8000">
        <div class="pod-name">Oscar Piastri</div>
      </div>
    </div>
  </div>

  <!-- DRIVER OF THE DAY -->
  <div class="dotd-wrap">
    <div class="dotd-photo" style="background-image:url('/drivers/tony_yo.png')"></div>
    <div class="dotd-body" style="--drv-color:#FF8000">
      <div class="dotd-text">
        <div class="dotd-tag">Driver of the Day</div>
        <div class="dotd-name">Lando Norris</div>
      </div>
      <div class="dotd-score-area">
        <div class="dotd-score">18.2</div>
        <div class="dotd-score-label">Score</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button>&#9654; Watch Again</button>
    <button>&#9776; Race Results</button>
    <button>&#128220; Race Report</button>
    <button class="secondary">&larr; All Replays</button>
  </div>
</div>

</body>
</html>
